<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EdgeGuard | 安全工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#20243b;background:#f5f5fa;font:14px "Segoe UI","Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #846eff;outline-offset:2px}
aside{position:fixed;inset:0 auto 0 0;width:210px;background:#17192c;color:#b4b6cc;display:flex;flex-direction:column;padding:29px 16px}.brand{display:flex;gap:10px;align-items:center;color:white;font:700 23px "Segoe UI",sans-serif;margin:0 7px 40px}.logo{width:31px;height:33px;background:linear-gradient(145deg,#d6d0ff,#826af2);clip-path:polygon(50% 0,94% 17%,84% 72%,50% 100%,16% 72%,6% 17%);display:grid;place-items:center;color:#32275b;font-size:18px}nav{display:grid;gap:7px}nav button{border:0;border-radius:8px;background:none;color:inherit;text-align:left;padding:12px 14px}nav button.current{color:white;background:#403663}nav button:hover{background:#302d47}nav b{display:inline-block;width:29px;font-size:18px}.demo{margin-top:auto;padding:15px 8px 0;border-top:1px solid #38394f;font-size:12px;color:#c1bdd4}.dot{display:inline-block;width:8px;height:8px;background:#85d8bf;border-radius:50%;margin-right:7px}
main{margin-left:210px;padding:30px clamp(18px,3vw,48px) 45px;max-width:1860px}.top,.head,.inline,.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:30px;margin:0;letter-spacing:-1px}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0}p,small,.sub{color:#62667f}p{line-height:1.6}.top p{margin:5px 0 0}.filters,.tools,.inline{display:flex;align-items:center;gap:8px}.tools{justify-content:flex-start;margin:16px 0}.box,select,input,.btn{border:1px solid #dddde8;border-radius:8px;background:#fff;color:inherit;padding:8px 10px}.btn:hover{border-color:#8474cb}.metrics,.split,.assets{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,1fr);margin:22px 0 15px}.split{grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);margin-bottom:15px}.assets{grid-template-columns:repeat(3,1fr);margin-top:20px}article,.metric{background:white;border:1px solid #e1e1eb;border-radius:14px;padding:19px;min-width:0;box-shadow:0 2px 5px #20203b05}.metric{text-align:left;display:block;color:inherit}.metric:hover{border-color:#9e8ce1}.metric strong{display:block;font:650 32px "Segoe UI",sans-serif;margin:8px 0 4px}.metric small{font-size:12px}.metric i{float:right;background:#eeebff;border-radius:7px;color:#6752bd;padding:4px 8px;font-style:normal}.plot{width:100%;height:175px;display:block;margin:12px 0 0}.legend{color:#676880;font-size:12px}.key{display:inline-block;width:10px;height:10px;background:#7762d8;border-radius:3px;margin:0 4px 0 8px}.key.orange{background:#ee9366}.rank{width:100%;display:block;text-align:left;border:0;background:none;padding:10px 0;color:inherit}.rank span{display:flex;justify-content:space-between}.track{height:6px;background:#efedf8;border-radius:8px;margin-top:6px;overflow:hidden}.track i{display:block;height:100%;background:#9482dd;border-radius:8px}.list{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{text-align:left;border-bottom:1px solid #ececf1;padding:11px 8px}th{font-size:12px;color:#70758a;font-weight:600}.link{border:0;background:transparent;color:#5b48a8;padding:0;text-align:left}.pill{display:inline-block;border-radius:5px;background:#eeebfc;color:#5d49a9;padding:3px 7px;font-size:12px}.drop{background:#fff0e6;color:#944615}.ok{background:#e2f6ee;color:#216951}.asseticon{display:inline-grid;place-items:center;border-radius:10px;background:#efedff;color:#6651ae;width:36px;height:36px;font-size:20px}.pair{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #eeeef3}.foot{margin:16px 0 0;color:#75798f;font-size:12px}.pager{justify-content:flex-end;margin-top:12px}.btn:disabled{opacity:.4;cursor:default}dialog{position:fixed;margin:0 0 0 auto;height:100%;max-height:100%;width:min(500px,96vw);border:0;padding:27px;color:inherit}dialog::backdrop{background:#16152e66}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#202337;color:#e2dcff;padding:14px;border-radius:8px;font-size:12px}section[hidden]{display:none}
@media(max-width:980px){aside{width:158px;padding:24px 9px}main{margin-left:158px}.metrics{grid-template-columns:repeat(2,1fr)}.assets{grid-template-columns:1fr}.brand{font-size:19px}}@media(max-width:720px){aside{position:static;width:auto;padding:12px}.brand{margin:0 0 8px}.demo{display:none}nav{display:flex;overflow:auto}nav button{white-space:nowrap;padding:7px}nav b{width:auto;margin-right:4px}main{margin:0;padding:18px 12px}.split{grid-template-columns:1fr}.filters{flex-wrap:wrap}.metrics{gap:8px}.metric{padding:12px}h1{font-size:24px}}
#trend{display:flex;align-items:center;justify-content:center;gap:clamp(20px,4vw,64px);padding:28px 8px;flex-wrap:wrap}.actionRing{width:clamp(140px,15vw,208px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center}.actionRing>div{width:76%;height:76%;background:white;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#666b80;font-size:13px}.actionRing strong{font-size:36px;color:#23253b;line-height:1.15}.actionLegend{display:grid;gap:12px}.actionKey{border:0;background:transparent;display:grid;grid-template-columns:9px auto auto;align-items:center;text-align:left;gap:4px 10px;color:#35364c;padding:7px;cursor:pointer}.actionKey:before{content:"";height:9px;width:9px;border-radius:50%;background:#7462ce}.actionKey.blocked:before{background:#e68a55}.actionKey small{grid-column:2;color:#696d81}.actionKey:hover{background:#f6f5fa;border-radius:6px}</style>
<aside><div class="brand"><span class="logo">E</span>EdgeGuard</div><nav id="nav"></nav><div class="demo"><span class="dot"></span>EdgeGuard · 本地设备</div></aside>
<main><header class="top"><div><h1 id="title"></h1><p>读取树莓派中…</p></div><div class="filters"><select id="device" aria-label="选择设备"></select><select id="range" aria-label="时间范围"><option value="experiment">本轮实验记录</option><option value="60" selected>最近 1 小时</option><option value="30">最近 30 分钟</option><option value="15">最近 15 分钟</option></select></div></header>
<section id="overview"><div class="metrics" id="metrics"></div><div class="split"><article><div class="head"><h2>告警处置分布</h2></div><div id="trend"></div></article><article><h2>命中规则排行</h2><div id="ranking"></div></article></div><article><div class="head"><h2>最近告警</h2><button class="link" id="seeAll">查看全部 →</button></div><div class="list" id="recent"></div></article></section>
<section id="inbox" hidden><article style="margin-top:20px"><div class="head"><h2>事件列表</h2><button class="btn" id="export">导出筛选结果 ↓</button></div><div class="tools"><input id="q" type="search" placeholder="搜索规则、SID 或 IP" aria-label="搜索"><select id="action"><option value="">全部动作</option><option value="blocked">已阻断</option><option value="allowed">告警放行</option></select><select id="state"><option value="">全部处置状态</option><option value="new">待确认</option><option value="ack">已确认</option></select><button class="link" id="reset">清除筛选</button></div><div class="list" id="eventTable"></div><div class="inline pager"><small id="pageLabel"></small><button class="btn" id="prev">上一页</button><button class="btn" id="next">下一页</button></div></article></section>
<section id="devices" hidden><div class="assets" id="assetGrid"></div></section><section id="rules" hidden><article style="margin-top:20px"><h2>规则与覆盖业务</h2><div class="list" id="ruleTable"></div></article></section><section id="health" hidden><div class="assets" id="healthGrid"></div></section>
<footer class="foot">各视图共享设备与时间范围。实时刷新 · 实时引擎最近 2 MiB 与本轮实验归档。</footer></main>
<dialog id="drawer"><div class="head"><h2>告警详情</h2><button class="btn" id="close">关闭</button></div><div id="detailBody"></div><div class="tools"><button class="btn" id="ack"></button><button class="btn" id="related">筛选同源事件</button></div><details><summary>查看 EVE 原始记录</summary><pre id="raw"></pre></details></dialog>
<script>
const $=id=>document.getElementById(id);
let assets=[],events=[],clock=Date.now();
const views={overview:['◫','安全总览'],inbox:['≋','告警中心'],devices:['▦','设备资产'],rules:['≡','检测规则'],health:['⌁','引擎健康']};
let view='overview',page=1,selected=null,acknowledged=new Set();
try{acknowledged=new Set(JSON.parse(localStorage.getItem('eg.live.v2.ack')||'[]'))}catch{}
const scope=()=>events.filter(e=>($('range').value==='experiment'?Boolean(e.raw.experiment_source):e.minute>=60-Number($('range').value))&&(!$('device').value||e.device===$('device').value));
const devices=()=>assets.filter(a=>!$('device').value||a.id===$('device').value);
const matched=()=>scope().filter(e=>(!$('action').value||e.action===$('action').value)&&(!$('state').value||(acknowledged.has(e.id)?'ack':'new')===$('state').value)&&[e.sid,e.name,e.src,e.dest].join(' ').toLowerCase().includes($('q').value.trim().toLowerCase()));
function button(label,click,cls='btn'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=click;return b}
function go(name){view=name;Object.keys(views).forEach(v=>{$(v).hidden=v!==name;$('nav-'+v).classList.toggle('current',v===name)});$('title').textContent=views[name][1];render();window.scrollTo(0,0)}
function drill(action='',query='',state=''){$('action').value=action;$('q').value=query;$('state').value=state;page=1;go('inbox')}
function pill(label,cls=''){const span=document.createElement('span');span.className='pill '+cls;span.textContent=label;return span}
function table(headings,rows){const t=document.createElement('table');const h=t.createTHead().insertRow();headings.forEach(s=>{let th=document.createElement('th');th.textContent=s;h.append(th)});const body=t.createTBody();rows.forEach(row=>{const tr=body.insertRow();row.forEach(value=>{const cell=tr.insertCell();if(value instanceof Node)cell.append(value);else cell.textContent=value})});if(!rows.length){const cell=body.insertRow().insertCell();cell.colSpan=headings.length;cell.textContent='没有符合条件的记录'}return t}
function eventTable(rows){return table(['时间','事件 / 规则','设备','源地址','引擎动作','处置'],rows.map(e=>[e.time,button(e.name,()=>openEvent(e),'link'),e.device,e.src,e.action==='blocked'?pill('已阻断','drop'):pill('告警放行'),acknowledged.has(e.id)?'已确认':'待确认']))}
function pair(parent,label,value){const row=document.createElement('div');row.className='pair';const k=document.createElement('small');k.textContent=label;const v=document.createElement('strong');v.textContent=value;row.append(k,v);parent.append(row)}
function openEvent(e){selected=e;const box=$('detailBody');box.replaceChildren();const name=document.createElement('h2');name.textContent=e.name;box.append(document.createElement('hr'),name);for(const [k,v] of [['采样时间',e.time],['设备',e.device],['源地址',e.src],['目标',e.dest+':'+e.port],['协议',e.proto],['规则 SID',e.sid],['引擎动作',e.action]])pair(box,k,v);
$('ack').textContent=acknowledged.has(e.id)?'撤销确认':'确认告警';$('raw').textContent=JSON.stringify(e.raw,null,2);$('drawer').showModal()}
function chart(rows){
 const total=rows.length;
 const blocked=rows.filter(e=>e.action==='blocked').length;
 const allowed=total-blocked;
 const share=n=>total?100*n/total:0;
 const ring=document.createElement('div');
 ring.className='actionRing';
 ring.style.background=total?'conic-gradient(#7462ce 0 '+share(allowed)+'%, #e68a55 '+share(allowed)+'% 100%)':'#e6e7ed';
 const center=document.createElement('div');
 const value=document.createElement('strong');
 value.textContent=total;
 center.append(value,'条告警');ring.append(center);
 const legend=document.createElement('div');legend.className='actionLegend';
 for(const [label,n,action] of [['告警放行',allowed,'allowed'],['已阻断',blocked,'blocked']]){
  const item=button(label,()=>drill(action),'actionKey '+action);
  const count=document.createElement('strong');count.textContent=n+' 条';
  const percent=document.createElement('small');percent.textContent=share(n).toFixed(1)+'%';
  item.append(count,percent);legend.append(item);
 }
 $('trend').replaceChildren(ring,legend);
}
function render(){const rows=scope(),ds=devices(),counts=Array.from(new Set(rows.map(e=>e.sid))).map(sid=>{const group=rows.filter(e=>e.sid===sid);return {a:assets[0],sid,name:group[0].name,n:group.length}}).sort((a,b)=>b.n-a.n);
if(view==='overview'){$('metrics').replaceChildren();for(const [label,num,note,icon,fn] of [['保护对象',ds.length,'已选设备','◇',()=>go('devices')],['告警事件',rows.length,'当前时间范围','≋',()=>drill()],['已阻断',rows.filter(e=>e.action==='blocked').length,'引擎动作','⊘',()=>drill('blocked')],['待确认',rows.filter(e=>!acknowledged.has(e.id)).length,'人工处置','◷',()=>drill('','','new')]]){const b=button('',fn,'metric');b.innerHTML='<i>'+icon+'</i>'+label+'<strong>'+num+'</strong><small>'+note+' →</small>';$('metrics').append(b)}chart(rows);$('ranking').replaceChildren();for(const r of counts){const b=button('',()=>drill('',String(r.sid)),'rank');b.innerHTML='<span>'+escapeText(r.name)+'<b>'+r.n+'</b></span><div class="track"><i style="width:'+100*r.n/Math.max(1,counts[0].n)+'%"></i></div>';$('ranking').append(b)}$('recent').replaceChildren(eventTable(rows.slice(0,5)))}
if(view==='inbox'){const found=matched(),pages=Math.max(1,Math.ceil(found.length/10));page=Math.min(page,pages);$('eventTable').replaceChildren(eventTable(found.slice((page-1)*10,page*10)));$('pageLabel').textContent=found.length+' 条 · 第 '+page+' / '+pages+' 页';$('prev').disabled=page===1;$('next').disabled=page===pages}
if(view==='rules')$('ruleTable').replaceChildren(table(['SID','规则名称','设备','检测协议','命中数'],counts.map(r=>[r.sid,button(r.name,()=>drill('',String(r.sid)),'link'),r.a.name,rows.find(e=>e.sid===r.sid).proto,r.n])));
if(view==='devices'||view==='health'){const health=view==='health',grid=$(health?'healthGrid':'assetGrid');grid.replaceChildren();for(const a of ds){const card=document.createElement('article');card.innerHTML='<span class="asseticon">'+a.icon+'</span><h2>'+escapeText(a.name)+'</h2><small>'+escapeText(a.id)+' · '+a.kind+'</small>';const fields=health?[['引擎模式',a.mode],['设备 CPU',a.cpu+'%'],['设备内存',a.ram+'%'],['温度',a.temp+' °C'],['NFQUEUE',a.mode==='IPS'?'42 · 配置值':'—']]:[['接口地址',a.ip],['保护业务',a.service],['服务端口','TCP '+a.port],['防护模式',a.mode]];fields.forEach(([k,v])=>pair(card,k,v));card.append(button('查看设备告警 →',()=>{$('device').value=a.id;drill()},'link'));grid.append(card)}}}
for(const [id,[icon,label]] of Object.entries(views)){const b=button('',()=>go(id));b.id='nav-'+id;b.innerHTML='<b>'+icon+'</b>'+label;$('nav').append(b)}
$('device').add(new Option('全部设备',''));assets.forEach(a=>$('device').add(new Option(a.name,a.id)));
for(const id of ['device','range','q','action','state'])$(id).oninput=()=>{page=1;render()};
$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('seeAll').onclick=()=>drill();$('reset').onclick=()=>drill();$('close').onclick=()=>$('drawer').close();$('related').onclick=()=>{$('drawer').close();drill('',selected.src)};
$('ack').onclick=()=>{if(acknowledged.has(selected.id))acknowledged.delete(selected.id);else acknowledged.add(selected.id);try{localStorage.setItem('eg.live.v2.ack',JSON.stringify([...acknowledged]))}catch{}$('drawer').close();render()};
$('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(matched().map(e=>({...e,acknowledged:acknowledged.has(e.id)})),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='edgeguard-events.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
window.addEventListener('resize',()=>{if(view==='overview')chart(scope())});go('overview');
function escapeText(v){const node=document.createElement('span');node.textContent=v;return node.innerHTML}
async function refreshLive(){
 try{
 const response=await fetch('/api/live',{cache:'no-store'});if(!response.ok)throw Error();
 const d=await response.json();clock=d.now*1000;
 assets=[{id:d.device,name:d.device,kind:'Linux 边缘终端',service:'实验 HTTP',ip:d.ip,port:d.business_port,mode:d.mode,cpu:d.cpu,ram:d.ram,temp:d.temp,icon:'◇'}];
 if($('device').options.length===1)$('device').add(new Option(d.device,d.device));
 events=d.events.map(e=>({raw:e,id:e.timestamp+'|'+e.flow_id+'|'+e.alert.signature_id,device:d.device,minute:Math.min(59,Math.floor(60-(clock-Date.parse(e.timestamp))/60000)),time:e.timestamp.slice(11,19),sid:e.alert.signature_id,name:e.alert.signature,src:e.src_ip,dest:e.dest_ip,port:e.dest_port,proto:e.app_proto||e.proto,action:e.alert.action}));
 document.querySelector('.top p').textContent=d.device+' · '+d.mode+' · '+new Date(clock).toLocaleTimeString();render();
 }catch{document.querySelector('.top p').textContent='采样失败 · 上次读数已过期'}finally{setTimeout(refreshLive,3000)}
}
refreshLive();
</script></html>
